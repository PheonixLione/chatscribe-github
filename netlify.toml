# Netlify configuration for ChatScribe.
#
# What this does:
# - Installs deps with pnpm (workspace-aware).
# - Builds only the web artifact (the API ships as a serverless function).
# - Publishes the SPA from artifacts/web/dist/public.
# - Routes /api/* to the single serverless function that wraps Express.
# - Falls back any other path to index.html for client-side wouter routing.

[build]
  # The Netlify function is pre-bundled and committed at
  # netlify/functions-built/api.mjs. Netlify just zips and ships it.
  # Why pre-build instead of letting Netlify bundle: for ESM .mts
  # entries Netlify's zip-it-and-ship-it falls back to NFT (file
  # inclusion only), which doesn't follow pnpm workspace symlinks
  # → cold-start crashes with `Cannot find package 'express'`.
  # Regenerate the bundle with:
  #   pnpm --filter @workspace/scripts run build-netlify-function
  command = "pnpm install --frozen-lockfile=false && pnpm --filter @workspace/web build"
  publish = "artifacts/web/dist/public"
  functions = "netlify/functions-built"

[build.environment]
  # Node 22+ is required: @sparticuz/chromium-min v148 declares
  # engines.node ">=22.17.0". Replit uses Node 24, so this is one
  # minor version behind dev — Netlify's currently-supported LTS
  # ceiling on the free plan.
  NODE_VERSION = "22"
  # Required for function runtime: pino skips the pino-pretty worker-thread
  # transport in production mode. Without this, Netlify's esbuild bundles
  # the function without esbuild-plugin-pino, the transport worker fails to
  # load, and the function crashes with 500 before handling any request.
  NODE_ENV = "production"
  # Tell @sparticuz/chromium-min where to download the matching Chromium
  # tarball at cold-start. This URL is pinned to the version that ships
  # with @sparticuz/chromium-min ^148.0.0 — bump in lockstep when you
  # upgrade the package. Hosted on GitHub releases (free, stable).
  CHROMIUM_PACK_URL = "https://github.com/Sparticuz/chromium/releases/download/v148.0.0/chromium-v148.0.0-pack.x64.tar"
  # Forces our own headless module to take the Netlify branch even when
  # NETLIFY isn't yet set during the build phase.
  NETLIFY = "true"

[functions]
  # Our api.mjs is already a fully-inlined ESM bundle (pre-built via
  # `pnpm --filter @workspace/scripts run build-netlify-function` and
  # committed to the repo). NFT (Node File Tracer) just copies the
  # file as-is — since the bundle has no non-built-in imports, NFT
  # has nothing to trace and ships api.mjs unchanged. Avoids the
  # esbuild re-bundling that was pulling in unrelated workspace files.
  node_bundler = "nft"

# Same-origin API: every /api/* request is served by the catch-all
# function. status=200 makes this a rewrite (not a redirect), so the
# browser keeps the original URL and CORS isn't involved.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback — any path not matched above (and not a real static file)
# serves index.html so the React router can take over.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
