<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta property="og:title" content="Best beaches in Portugal" />
<title>Gemini share</title>
</head>
<body>
<div class="conversation-container">
  <user-query>
    <div class="query-text">What are the best beaches in Portugal?</div>
  </user-query>
  <model-response>
    <div class="response-content">
      <p>Portugal has many great beaches. Here are a few highlights:</p>
      <ul>
        <li>Praia da Marinha (Algarve)</li>
        <li>Praia do Camilo (Lagos)</li>
        <li>Praia da Ursa (Sintra)</li>
      </ul>
    </div>
  </model-response>
  <user-query>
    <div class="query-text">Which is least crowded?</div>
  </user-query>
  <model-response>
    <div class="response-content">
      <p><strong>Praia da Ursa</strong> is typically the least crowded of the three.</p>
    </div>
  </model-response>
</div>
</body>
</html>
